<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Paper 卡片 · 三维重建 × 世界模型</title>
<style>
  :root{
    --bg:#f5f5f5; --ink:#222; --ink2:#555; --muted:#999;
    --card:#fff; --line:#eee; --accent:#ff4d6d; --accent2:#ff7b54;
    --soft:#fff0f2; --tagbg:#f2f3f5;
    --shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  }
  body[data-theme="dark"]{
    --bg:#101014; --ink:#f0ece6; --ink2:#b8b2aa; --muted:#777;
    --card:#1b1b21; --line:#2a2a32; --accent:#ff6b85; --accent2:#ff9b7a;
    --soft:#2a1d22; --tagbg:#26262e;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.65;transition:background .25s,color .25s}
  a{color:inherit;text-decoration:none}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px}
  .topbar .logo{font-weight:900;font-size:16px;letter-spacing:.5px}
  .topbar .logo em{color:var(--accent);font-style:normal}
  .topbar .meta{color:var(--muted)}
  .topbar .sp{flex:1}
  .tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
    padding:5px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

  /* 空状态 */
  .empty{max-width:640px;margin:80px auto;text-align:center;padding:0 24px}
  .empty .big{font-size:56px;margin-bottom:14px}
  .empty h2{font-size:20px;margin-bottom:8px}
  .empty p{color:var(--muted);font-size:14px}

  /* 瀑布流 */
  .feed{max-width:1000px;margin:0 auto;padding:16px 14px 90px;column-count:2;column-gap:14px}
  @media(min-width:1100px){.feed{column-count:3}}
  @media(max-width:680px){.feed{column-count:1;padding:12px 10px 80px}}
  .card{break-inside:avoid;background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
  .card .cover{padding:16px 16px 12px;position:relative;background:linear-gradient(135deg,var(--soft),var(--card))}
  .card .cat{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-size:10px;
    font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:999px}
  .card .tzh{font-size:19px;font-weight:800;line-height:1.35;margin:0 0 6px;letter-spacing:-.2px}
  .card .hook{color:var(--accent2);font-size:13.5px;font-weight:600;margin-bottom:10px}
  .card .hook::before{content:"✦ "}
  .card .meta{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
  .card .body{padding:2px 16px 14px}
  .card .lead{font-size:14px;color:var(--ink2);line-height:1.75}
  .card .lead code{background:var(--tagbg);padding:1px 6px;border-radius:5px;font-size:12.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .influence{margin:10px 0 0;font-size:12px;color:var(--ink2);background:var(--tagbg);
    padding:7px 11px;border-radius:9px}
  .influence b{color:var(--accent)}

  /* 内容子卡 */
  .subcards{padding:0 16px 14px;display:grid;gap:9px}
  .sub{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .sub .sh{font-size:13px;font-weight:800;margin-bottom:3px}
  .sub .sh .em{margin-right:7px}
  .sub .sb{font-size:13px;color:var(--ink2);line-height:1.7}
  .sub .sb code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line)}

  /* 展开深读 */
  .more{padding:0 16px 14px}
  .more summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);
    padding:8px 0;border-top:1px dashed var(--line)}
  .more summary::-webkit-details-marker{display:none}
  .more summary::before{content:"📖 深读版 · 0-6 字段 "}
  .more[open] summary::before{content:"收起深读 "}
  .fields{display:grid;gap:8px;padding-top:4px}
  .f h5{font-size:12px;font-weight:800}
  .f h5 .n{color:var(--accent);margin-right:5px}
  .f p{font-size:12.5px;color:var(--ink2);line-height:1.7}

  /* 底部操作 */
  .acts{display:flex;gap:8px;align-items:center;padding:0 16px 15px;flex-wrap:wrap}
  .alnk{flex:1;min-width:130px;text-align:center;border:1px solid var(--line);border-radius:999px;
    padding:7px 10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .alnk:hover{border-color:var(--accent);color:var(--accent)}
  .fb{display:flex;gap:6px}
  .fb button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font-size:15px;color:var(--muted)}
  .fb button.on-lk{background:#2e7d32;border-color:#2e7d32;color:#fff}
  .fb button.on-dk{background:var(--accent);border-color:var(--accent);color:#fff}

  .colophon{text-align:center;color:var(--muted);font-size:12px;line-height:1.9;padding:20px 16px 40px}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;
    background:#222;color:#fff;font-size:13px;padding:10px 22px;border-radius:999px;z-index:99;
    transition:all .3s;pointer-events:none;max-width:88vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-theme="light">

<div class="topbar">
  <span class="logo">Paper<em>卡片</em></span>
  <span class="meta" id="tbMeta"></span>
  <span class="sp"></span>
  <button class="tbtn" id="themeBtn">◐ 暗色</button>
  <button class="tbtn primary" id="copyBtn">📤 复制文案</button>
</div>

<div class="empty" id="emptyState" hidden>
  <div class="big">🍃</div>
  <h2>今日无精选</h2>
  <p id="emptyReason"></p>
</div>

<div class="feed" id="feedMount"></div>

<div class="colophon" id="colophon"></div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.PAPER_DAILY_DATA || {};
  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
  function fmtLead(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");}

  document.getElementById("tbMeta").textContent =
    (D.axes||"三维重建 × 世界模型") + " · " + (D.date||"") + " · " + ((D.counts&&D.counts.total)||0) + " 篇";

  // 空状态
  if(D.empty || !(D.papers||[]).length && !D.hero){
    document.getElementById("emptyState").hidden = false;
    document.getElementById("emptyReason").textContent = D.reason || "今日时间窗内无命中偏好方向的合适论文，明天见。";
    document.getElementById("colophon").textContent = "Paper卡片 · 每天几张卡片读懂一篇论文";
    return;
  }

  var all = [].concat(D.hero?[D.hero]:[], D.papers||[]);

  function cardHtml(p, i){
    var subs = (p.cards||[]).map(function(c){
      return '<div class="sub"><div class="sh"><span class="em">'+esc(c.emoji||"💡")+'</span>'+esc(c.title||"")+'</div>'+
             '<div class="sb">'+fmtLead(c.body||"")+'</div></div>';
    }).join("");
    var F=[["background","Background"],["task","Task"],["insight","Insight"],["pipeline","Pipeline"],
           ["methods","Methods"],["experiment","Experiment"],["limitation","Limitation"]];
    var flds = (p.fields||{}) ? F.map(function(x,ix){
      var v=(p.fields[x[0]]||"");
      return v?'<div class="f"><h5><span class="n">'+ix+'</span>'+x[1]+'</h5><p>'+esc(v)+'</p></div>':"";
    }).join("") : "";
    return '<article class="card" data-i="'+i+'">'+
      '<div class="cover">'+
        '<span class="cat">'+esc(p.category||"PAPER")+'</span>'+
        '<h3 class="tzh">'+esc(p.titleZh||p.title||"")+'</h3>'+
        (p.hook?'<div class="hook">'+esc(p.hook)+'</div>':'')+
        '<div class="meta">'+esc(p.authors||"")+' · '+esc(p.venue||"")+'</div>'+
      '</div>'+
      '<div class="body"><p class="lead">'+fmtLead(p.summary||"")+'</p>'+
        (p.influence?'<div class="influence">⭐ <b>热度/影响力</b>：'+esc(p.influence)+'</div>':'')+
      '</div>'+
      (subs?'<div class="subcards">'+subs+'</div>':'')+
      '<div class="more"><details><summary></summary><div class="fields">'+flds+'</div></details></div>'+
      '<div class="acts">'+
        '<a class="alnk" href="'+esc(p.paperUrl||"#")+'" target="_blank" rel="noopener">论文原文 ↗</a>'+
        '<span class="fb"><button class="lk" title="喜欢">👍</button><button class="dk" title="不喜欢">👎</button></span>'+
      '</div>'+
    '</article>';
  }

  var mount = document.getElementById("feedMount");
  mount.innerHTML = all.map(cardHtml).join("");

  // 反馈按钮
  mount.querySelectorAll(".fb").forEach(function(fb){
    var lk=fb.querySelector(".lk"), dk=fb.querySelector(".dk");
    lk.addEventListener("click",function(){lk.classList.toggle("on-lk");dk.classList.remove("on-dk");toast("已记：喜欢（可截图反馈给助手）");});
    dk.addEventListener("click",function(){dk.classList.toggle("on-dk");lk.classList.remove("on-lk");toast("已记：不喜欢（可截图反馈给助手）");});
  });

  // 主题
  var btn=document.getElementById("themeBtn");
  function setTheme(t){document.body.setAttribute("data-theme",t);btn.textContent=t==="dark"?"☀ 浅色":"◐ 暗色";
    try{localStorage.setItem("pc-theme",t);}catch(e){}}
  var s=null;try{s=localStorage.getItem("pc-theme");}catch(e){}
  if(s)setTheme(s);
  btn.addEventListener("click",function(){setTheme(document.body.getAttribute("data-theme")==="dark"?"light":"dark");});

  // toast + 复制
  var tt=document.getElementById("toast");
  function toast(m){tt.textContent=m;tt.classList.add("show");setTimeout(function(){tt.classList.remove("show");},2000);}
  function copyText(){
    var L=[];
    L.push("Paper卡片 · "+(D.date||"")+" · "+((D.counts&&D.counts.total)||0)+" 篇");
    L.push("");
    all.forEach(function(p,i){
      L.push("▍"+(i+1)+". "+(p.titleZh||p.title));
      if(p.hook)L.push("✦ "+p.hook);
      L.push(p.summary);
      (p.cards||[]).forEach(function(c){L.push(c.emoji+" "+c.title+"："+c.body);});
      L.push("原文："+p.paperUrl);
      L.push("");
    });
    return L.join("\n");
  }
  document.getElementById("copyBtn").addEventListener("click",function(){
    var txt=copyText();
    function ok(){toast("✓ 已复制，去公众号/笔记 App 粘贴");}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fb(txt,ok);});}
    else fb(txt,ok);
  });
  function fb(txt,ok){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){toast("复制失败，请手动复制");}
    document.body.removeChild(ta);}

  document.getElementById("colophon").innerHTML =
    "Paper卡片 · "+esc(D.axes||"三维重建 × 世界模型")+" · 每天几张卡片读懂一篇论文<br>数据自动生成 · "+
    ((D.counts&&D.counts.total)||0)+" 篇 · "+esc(D.date||"");
})();
</script>
</body>
</html>
