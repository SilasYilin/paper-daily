<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Paper 卡片 · 三维重建 × 世界模型</title>
<style>
  :root{
    --bg:#f7f7f5; --ink:#1a1a1a; --ink2:#4a4a48; --muted:#9a9a96;
    --card:#ffffff; --line:#e8e8e4; --accent:#c8402a; --soft:#faf6f3;
    --tagbg:#f2f1ee;
  }
  body[data-theme="dark"]{
    --bg:#141412; --ink:#ecebe6; --ink2:#b5b3ac; --muted:#6f6e69;
    --card:#1e1e1b; --line:#2c2c28; --accent:#e8664f; --soft:#242220;
    --tagbg:#262622;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.7;transition:background .25s,color .25s}
  a{color:inherit;text-decoration:none}

  /* 顶栏：细线极简 */
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
    padding:12px 20px;display:flex;align-items:baseline;gap:12px}
  .topbar .logo{font-weight:700;font-size:15px;letter-spacing:.3px}
  .topbar .logo i{color:var(--accent);font-style:normal}
  .topbar .meta{color:var(--muted);font-size:12px}
  .topbar .sp{flex:1}
  .tbtn{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:6px;
    padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

  /* 论文选择条：横向页码 */
  .selector{max-width:760px;margin:26px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .selector .lbl{font-size:11px;color:var(--muted);letter-spacing:2px;margin-right:4px}
  .pnum{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s}
  .pnum.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
  .pnum:hover{border-color:var(--accent)}

  /* 舞台：一张卡占满视口中心 */
  .stage{max-width:760px;margin:14px auto 40px;padding:0 20px;position:relative}

  .pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.03),0 12px 40px rgba(0,0,0,.05);
    min-height:540px;display:flex;flex-direction:column;overflow:hidden;
    animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 封面页 */
  .cover{flex:1;display:flex;flex-direction:column;padding:44px 40px 30px;position:relative}
  .cover .kicker{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:18px;text-transform:uppercase}
  .cover h1{font-size:30px;font-weight:800;line-height:1.4;letter-spacing:-.3px;margin-bottom:14px}
  .cover .orig{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px;font-style:italic}
  .cover .hook{font-size:16px;color:var(--accent);font-weight:600;margin-bottom:26px}
  .cover .foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
  .cover .score{background:var(--soft);padding:3px 12px;border-radius:999px;font-weight:700;color:var(--accent)}

  /* 内容页 */
  .page{flex:1;display:none;flex-direction:column;padding:38px 40px 26px}
  .page .pgtag{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
  .page h2{font-size:21px;font-weight:800;margin-bottom:4px}
  .page h2 .em{margin-right:10px}
  .page .rule{width:34px;height:3px;background:var(--accent);border-radius:2px;margin:12px 0 18px}
  .page .txt{font-size:14.5px;color:var(--ink2);line-height:1.85}
  .page .txt code{background:var(--tagbg);padding:1px 6px;border-radius:5px;font-size:13px;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .page .txt p{margin-bottom:10px}
  .page .note{margin-top:auto;padding-top:14px;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line)}

  /* 导读页（通俗） */
  .page.intro .txt{font-size:15.5px;color:var(--ink)}
  .page.intro .txt::first-letter{font-size:34px;font-weight:800;color:var(--accent);float:left;
    line-height:1;margin:4px 8px 0 0}

  /* 流程图页 */
  .page.fig .figwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .page.fig img{max-width:100%;max-height:380px;object-fit:contain;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);align-self:center}
  .page.fig .cap{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .page.fig .explain{margin-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.8}
  .figmiss{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
  .figmiss .ico{font-size:40px;display:block;margin-bottom:10px;opacity:.5}

  /* 字段页（深读） */
  .page.fields .flist{display:grid;gap:13px}
  .page.fields .f h5{font-size:12px;font-weight:800;letter-spacing:.5px}
  .page.fields .f h5 .n{color:var(--accent);margin-right:7px}
  .page.fields .f p{font-size:12.8px;color:var(--ink2);line-height:1.75}

  /* 卡片底部导航 */
  .navbar{display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--soft)}
  .navbar .dots{flex:1;display:flex;gap:6px;justify-content:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .2s}
  .dot.on{background:var(--accent);width:20px;border-radius:4px}
  .nav{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 16px;
    font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit}
  .nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nav:disabled{opacity:.3;cursor:default}
  .pgno{font-size:11px;color:var(--muted);min-width:52px;text-align:center}

  /* 底部 */
  .colophon{text-align:center;color:var(--muted);font-size:12px;line-height:1.9;padding:8px 16px 46px}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);opacity:0;
    background:var(--ink);color:var(--bg);font-size:13px;padding:9px 20px;border-radius:8px;z-index:99;
    transition:all .3s;pointer-events:none;max-width:86vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 空状态 */
  .empty{max-width:640px;margin:90px auto;text-align:center;padding:0 24px}
  .empty .big{font-size:52px;margin-bottom:14px}
  .empty h2{font-size:19px;margin-bottom:8px}
  .empty p{color:var(--muted);font-size:14px}

  /* 键盘左右翻页提示 */
  .kbd{position:fixed;right:18px;bottom:18px;font-size:11px;color:var(--muted);opacity:.7}
  @media(max-width:640px){
    .cover{padding:32px 24px 22px}
    .page{padding:28px 24px 20px}
    .cover h1{font-size:24px}
    .pcard{min-height:520px}
    .kbd{display:none}
  }
</style>
</head>
<body data-theme="light">

<div class="topbar">
  <span class="logo">Paper<i>卡片</i></span>
  <span class="meta" id="tbMeta"></span>
  <span class="sp"></span>
  <button class="tbtn" id="themeBtn">暗色</button>
  <button class="tbtn primary" id="copyBtn">复制文案</button>
</div>

<div class="empty" id="emptyState" hidden>
  <div class="big">🍃</div>
  <h2>今日无精选</h2>
  <p id="emptyReason"></p>
</div>

<div id="appMount" hidden>
  <div class="selector" id="selector"><span class="lbl">本期论文</span></div>
  <div class="stage"><div class="pcard" id="pcard"></div></div>
  <div class="kbd">← → 键翻页</div>
</div>

<div class="colophon" id="colophon"></div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.PAPER_DAILY_DATA || {};
  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
  function fmt(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");}

  document.getElementById("tbMeta").textContent =
    (D.axes||"三维重建 × 世界模型") + " · " + (D.date||"") + " · " + ((D.counts&&D.counts.total)||0) + " 篇";

  if(D.empty || !((D.papers||[]).length || D.hero)){
    document.getElementById("emptyState").hidden = false;
    document.getElementById("emptyReason").textContent = D.reason || "今日时间窗内无命中偏好方向的合适论文，明天见。";
    document.getElementById("colophon").textContent = "Paper卡片 · 每篇论文一组卡片";
    return;
  }

  var all = [].concat(D.hero?[D.hero]:[], D.papers||[]);
  var cur = 0, sub = 0;

  // 每篇论文的页组：封面 / 导读(通俗) / 4 张内容卡(专业) / 流程图 / 深读字段
  function pagesOf(p){
    var pg = [];
    pg.push({t:"cover", p:p});
    if(p.summary) pg.push({t:"intro", p:p});
    (p.cards||[]).forEach(function(c){ pg.push({t:"card", c:c, p:p}); });
    if((p.figures&&p.figures.length) || p.figureNote) pg.push({t:"fig", p:p});
    pg.push({t:"fields", p:p});
    pg.push({t:"end", p:p});
    return pg;
  }
  var deck = all.map(pagesOf);

  var mount = document.getElementById("pcard");

  function render(){
    var pages = deck[cur];
    var page = pages[sub];
    var p = page.p;
    var h = "";
    if(page.t==="cover"){
      h = '<div class="cover">'+
        '<div class="kicker">'+esc(p.category||"PAPER")+'</div>'+
        '<h1>'+esc(p.titleZh||p.title||"")+'</h1>'+
        '<div class="orig">'+esc(p.title||"")+'</div>'+
        (p.hook?'<div class="hook">「'+esc(p.hook)+'」</div>':'')+
        '<div class="foot"><span>'+esc(p.authors||"")+' · '+esc(p.venue||"")+'</span>'+
        '<span class="score">匹配度 '+esc(String(p.score!=null?p.score:""))+'</span></div>'+
        '<div style="margin-top:14px;font-size:12px;color:var(--muted)">'+(p.influence?("⭐ "+esc(p.influence)):"")+'</div>'+
        '</div>';
    } else if(page.t==="intro"){
      h = '<div class="page intro" style="display:flex">'+
        '<div class="pgtag">导读 · 通俗版</div>'+
        '<h2>这篇在讲什么</h2><div class="rule"></div>'+
        '<div class="txt">'+fmt(p.summary)+'</div>'+
        '<div class="note">导读为通俗版，便于快速理解；后续卡片为专业表述。</div></div>';
    } else if(page.t==="card"){
      var c = page.c;
      h = '<div class="page" style="display:flex">'+
        '<div class="pgtag">'+esc(p.titleZh||"")+'</div>'+
        '<h2><span class="em">'+esc(c.emoji||"◆")+'</span>'+esc(c.title||"")+'</h2><div class="rule"></div>'+
        '<div class="txt">'+fmt(c.body||"")+'</div></div>';
    } else if(page.t==="fig"){
      var fig = (p.figures&&p.figures[0]);
      h = '<div class="page fig" style="display:flex">'+
        '<div class="pgtag">PIPELINE</div>'+
        '<h2><span class="em">🧩</span>流程图</h2><div class="rule"></div>'+
        '<div class="figwrap">'+
        (fig?('<img src="figs/'+esc(fig.file)+'" alt="pipeline figure">'+
              (fig.caption?'<div class="cap">'+esc(fig.caption)+'</div>':''))
            :'<div class="figmiss"><span class="ico">🧩</span>本文暂无 HTML 版流程图</div>')+
        (p.figureNote?'<div class="explain">'+fmt(p.figureNote)+'</div>':'')+
        '</div></div>';
    } else if(page.t==="fields"){
      var F=[["background","Background","背景"],["task","Task","任务"],["insight","Insight","核心洞察"],
             ["pipeline","Pipeline","流程"],["methods","Methods","方法"],["experiment","Experiment","实验"],
             ["limitation","Limitation","局限"]];
      var fl=(p.fields||{});
      var items=F.map(function(x,i){var v=fl[x[0]];return v?
        '<div class="f"><h5><span class="n">'+i+'</span>'+x[1]+' · '+x[2]+'</h5><p>'+esc(v)+'</p></div>':"";
      }).join("");
      h = '<div class="page fields" style="display:flex">'+
        '<div class="pgtag">DEEP READ</div>'+
        '<h2><span class="em">📚</span>深读 · 0-6 字段</h2><div class="rule"></div>'+
        '<div class="flist">'+(items||'<p style="color:var(--muted)">以原文为准。</p>')+'</div></div>';
    } else if(page.t==="end"){
      h = '<div class="page" style="display:flex">'+
        '<div class="pgtag">LINKS</div>'+
        '<h2><span class="em">📎</span>原文与反馈</h2><div class="rule"></div>'+
        '<div class="txt"><p>标题：'+esc(p.title||"")+'</p>'+
        '<p>原文：<a href="'+esc(p.paperUrl||"#")+'" target="_blank" rel="noopener" style="color:var(--accent)">'+esc(p.paperUrl||"")+'</a></p>'+
        '<p style="margin-top:18px">这篇对你的研究有帮助吗？</p></div>'+
        '<div style="display:flex;gap:10px;margin-top:6px">'+
        '<button class="nav" onclick="vote(1)">👍 有帮助</button>'+
        '<button class="nav" onclick="vote(-1)">👍 不对口</button></div>'+
        '<div class="note">反馈会进入偏好画像，影响后续筛选。</div></div>';
    }
    mount.innerHTML = h;
    mount.style.animation = "none"; void mount.offsetWidth; mount.style.animation = "";
    renderNav(pages.length);
    renderSelector();
  }

  var navbar = document.createElement("div"); navbar.className="navbar";
  mount.parentNode.appendChild(navbar);
  function renderNav(total){
    var dots = "";
    for(var i=0;i<total;i++) dots += '<span class="dot'+(i===sub?" on":"")+'" data-i="'+i+'"></span>';
    navbar.innerHTML = '<button class="nav" id="prevB" '+(sub===0?"disabled":"")+'>‹ 上一篇卡</button>'+
      '<div class="dots">'+dots+'</div><span class="pgno">'+(sub+1)+' / '+total+'</span>'+
      '<button class="nav" id="nextB">'+(sub===total-1?"下一篇论文 →":"下一张卡 ›")+'</button>';
    navbar.querySelectorAll(".dot").forEach(function(d){
      d.addEventListener("click",function(){sub=+d.dataset.i;render();});
    });
    document.getElementById("prevB").addEventListener("click",prev);
    document.getElementById("nextB").addEventListener("click",next);
  }
  var selEl = document.getElementById("selector");
  function renderSelector(){
    selEl.innerHTML = '<span class="lbl">本期论文</span>' + all.map(function(p,i){
      return '<button class="pnum'+(i===cur?" on":"")+'" data-i="'+i+'">'+(i+1)+'</button>';
    }).join("");
    selEl.querySelectorAll(".pnum").forEach(function(b){
      b.addEventListener("click",function(){cur=+b.dataset.i;sub=0;render();});
    });
  }
  function prev(){ if(sub>0){sub--;render();} else if(cur>0){cur--;sub=deck[cur].length-1;render();} }
  function next(){ if(sub<deck[cur].length-1){sub++;render();} else if(cur<deck.length-1){cur++;sub=0;render();} }

  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"||e.key==="PageDown")next();
    else if(e.key==="ArrowLeft"||e.key==="PageUp")prev();
  });

  // 触摸滑动
  var tx=null;
  document.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;},{passive:true});
  document.addEventListener("touchend",function(e){
    if(tx==null)return; var dx=e.changedTouches[0].clientX-tx;
    if(dx<-40)next(); else if(dx>40)prev(); tx=null;
  },{passive:true});

  window.vote = function(v){
    try{
      var fb = JSON.parse(localStorage.getItem("pd-feedback")||"[]");
      fb.push({title:all[cur].title, v:v, at:Date.now()});
      localStorage.setItem("pd-feedback", JSON.stringify(fb));
    }catch(e){}
    toast(v>0?"已记录：有帮助 ✓（下次同步给助手）":"已记录：不对口（用于调低同类）");
  };

  // 主题
  var btn=document.getElementById("themeBtn");
  function setTheme(t){document.body.setAttribute("data-theme",t);btn.textContent=t==="dark"?"浅色":"暗色";
    try{localStorage.setItem("pc-theme",t);}catch(e){}}
  var st=null;try{st=localStorage.getItem("pc-theme");}catch(e){}
  if(st)setTheme(st);
  btn.addEventListener("click",function(){setTheme(document.body.getAttribute("data-theme")==="dark"?"light":"dark");});

  // toast + 复制
  var tt=document.getElementById("toast");
  function toast(m){tt.textContent=m;tt.classList.add("show");setTimeout(function(){tt.classList.remove("show");},2200);}
  function copyText(){
    var L=[];
    L.push("Paper卡片 · "+(D.date||"")+" · "+((D.counts&&D.counts.total)||0)+" 篇");
    all.forEach(function(p,i){
      L.push("");
      L.push("▍"+(i+1)+". "+(p.titleZh||p.title));
      if(p.hook)L.push("「"+p.hook+"」");
      L.push("【导读】"+p.summary);
      (p.cards||[]).forEach(function(c){L.push(c.emoji+" "+c.title+"："+c.body);});
      L.push("原文："+p.paperUrl);
    });
    return L.join("\n");
  }
  document.getElementById("copyBtn").addEventListener("click",function(){
    var txt=copyText();
    function ok(){toast("✓ 已复制全部文案");}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fb(txt,ok);});}
    else fb(txt,ok);
  });
  function fb(txt,ok){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){toast("复制失败，请手动复制");}
    document.body.removeChild(ta);}

  document.getElementById("appMount").hidden = false;
  document.getElementById("colophon").innerHTML =
    "Paper卡片 · "+esc(D.axes||"三维重建 × 世界模型")+" · 每篇论文一组卡片 · 键盘 ←→ 或滑动翻页<br>"+
    ((D.counts&&D.counts.total)||0)+" 篇 · "+esc(D.date||"");
  render();
})();
</script>
</body>
</html>
